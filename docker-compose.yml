services:
  postgres:
    image: postgres:16-alpine
    container_name: databridge-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-databridge}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-databridge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: databridge-chromadb
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databridge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-databridge}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # host.docker.internal: Docker Desktop(Win/Mac)에서 호스트 접근
      # Linux Docker Engine: 아래 extra_hosts 설정 필요
      OLLAMA_HOST: http://host.docker.internal:${OLLAMA_PORT:-11434}
      LLM_MODEL: ${LLM_MODEL:-exaone3.5:7.8b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      SECRET_KEY: ${SECRET_KEY:-databridge-secret-key-change-me}
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ${WATCH_DIR_HOST:-./sample_data}:/data:ro
      - app_logs:/app/logs
    # ============================================================
    # Linux Docker Engine 사용 시 아래 주석 해제
    # (Docker Desktop은 host.docker.internal 기본 지원)
    # ============================================================
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  chroma_data:
  app_logs:
